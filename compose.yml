services:
  postgres:
    image: postgres:17
    container_name: hobbytree-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hobbytree
      POSTGRES_USER: hobbytree
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hobbytree -d hobbytree"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: