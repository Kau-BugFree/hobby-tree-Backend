spring:
  application:
    name: hobbytree

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  forward-headers-strategy: none

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

auth:
  kakao-app-id: ${KAKAO_APP_ID}
  google-client-id: ${GOOGLE_CLIENT_ID}
  jwt-secret: ${JWT_SECRET}
  issuer: hobbytree
  proxy:
    trusted-cidrs: ${AUTH_TRUSTED_PROXY_CIDRS:}

location:
  # A Kakao REST API key (서비스 앱 키), separate from auth.kakao-app-id (used only to
  # validate login tokens) - this one authenticates server-to-server calls to Kakao's Local
  # API (coord2regioncode) for API-42's DEVICE location path.
  # Empty default: the DEVICE location path is exercised through a mocked
  # KakaoCoordinateRegionResolver in tests (same pattern as SocialTokenVerifier), so the app
  # must still boot without this set.
  kakao-rest-api-key: ${KAKAO_REST_API_KEY:}

profile-image:
  # S3 bucket/region for API-08's presigned upload URLs. Empty defaults: the upload path is
  # exercised through a mocked S3Client/S3Presigner in tests (same pattern as
  # KakaoCoordinateRegionResolver), so the app must still boot without these set.
  bucket: ${PROFILE_IMAGE_S3_BUCKET:}
  region: ${PROFILE_IMAGE_S3_REGION:}
