spring:
  config:
    import: configtree:${APP_SECRETS_PATH:/run/secrets/hobbytree/}
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
      initialization-fail-timeout: 10000
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  # EC2 only accepts TCP 8080 from hobbytree-alb-sg, so the directly connected
  # peer is always the ALB. Trust X-Forwarded-For only from the ALB's VPC
  # (10.0.0.0/16) and restore the real client IP into getRemoteAddr(), instead
  # of trusting any caller-supplied header outright.
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 50
      min-spare: 5
    remoteip:
      internal-proxies: 10\.0\.\d{1,3}\.\d{1,3}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: false
      show-details: never
      show-components: never

# Suppress the unused generated development password; health access is explicit in SecurityConfig.
logging:
  level:
    org.springframework.boot.security.autoconfigure: ERROR
