
name: HobbyTree EC2 Preflight

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: hobbytree-ec2-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: SSM EC2 Preflight
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::494915081306:role/hobbytree-github-ec2-deploy-role
          aws-region: ap-northeast-2
          allowed-account-ids: '494915081306'

      - name: Execute EC2 preflight via SSM
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-0d71fcf646b7210f2"
          DOCUMENT="HobbyTree-Dev-Preflight"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT" \
            --document-version "1" \
            --comment "GitHub Actions EC2 preflight" \
            --timeout-seconds 120 \
            --max-concurrency "1" \
            --max-errors "0" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            echo "FAIL: EC2 preflight did not succeed"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent}' \
            --output json

          echo "PASS: GitHub to EC2 SSM preflight completed"
