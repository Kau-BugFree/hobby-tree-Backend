name: V5 CORS Linux Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOTFIX_SHA: 50f2fcd198241e8d7b6ab594057652bfc22a0d37

jobs:
  docker-validation:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Kau-BugFree/hobby-tree-Backend' && github.ref == 'refs/heads/ci/v5-cors-preflight'
    name: Docker amd64 and PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HOBBYTREE_CI: '1'
      BACKEND_IMAGE: hobbytree/backend:ci
      DB_URL: jdbc:postgresql://postgres:5432/hobbytree_ci?sslmode=verify-full&sslrootcert=/etc/hobbytree/certs/rds-ca.pem
      REDIS_SECRETS_DIR: /run/hobbytree/ci/redis-secrets
      AUTH_TRUSTED_PROXY_CIDRS: 192.0.2.10/32
      KAKAO_APP_ID: "1"
      GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
      APP_SECRETS_DIR: /run/hobbytree/ci/secrets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HOTFIX_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify the fixed candidate checkout
        run: test "$(git rev-parse HEAD)" = "$HOTFIX_SHA"

      - name: Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Tests and formatting
        run: |
          sh ./gradlew --no-daemon --max-workers=2 test spotlessCheck bootJar
          sudo python3 -m unittest discover -s scripts/tests -v
          systemd-analyze verify deploy/hobbytree-backend.service

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load linux/amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.BACKEND_IMAGE }}
          labels: org.opencontainers.image.revision=${{ env.HOTFIX_SHA }}

      - name: Verify image revision, platform and packaged V5 SQL
        run: |
          set -euo pipefail
          test "$(docker image inspect "$BACKEND_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$BACKEND_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$HOTFIX_SHA"
          container=$(docker create --platform linux/amd64 "$BACKEND_IMAGE")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/hobbytree.jar" "$RUNNER_TEMP/hobbytree-v5-hotfix.jar"
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import subprocess
          import zipfile

          spec = importlib.util.spec_from_file_location("release", "scripts/deploy/ec2-release.py")
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          jar = Path(os.environ["RUNNER_TEMP"]) / "hobbytree-v5-hotfix.jar"
          prefix = "BOOT-INF/classes/db/migration/"
          root = "src/main/resources/db/migration/"
          base = "058c1410a9bbb4805157f6b659064440267032b3"
          files = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", base, root], text=True).splitlines()
          assert len(files) == 5
          with zipfile.ZipFile(jar) as archive:
              assert sorted(p for p in archive.namelist() if p.startswith(prefix) and not p.endswith("/")) == sorted(
                  prefix + Path(p).name for p in files
              )
              assert not any("sponsoredcontent" in p.lower() for p in archive.namelist())
              assert "BOOT-INF/classes/application-local.yml" not in archive.namelist()
              for path in files:
                  original = subprocess.check_output(["git", "show", base + ":" + path])
                  assert archive.read(prefix + Path(path).name) == original, path
          assert release.schema_fingerprint(jar) == "84bbd4049e3e926c5b725d3c3213b2d6980202973aaba31299f1a4999dee0026"
          print("PASS: image contains only the five byte-identical V5 migrations and the reviewed fingerprint.")
          PY
          {
            printf 'Source revision: %s\nPlatform: linux/amd64\nLocal image ID: ' "$HOTFIX_SHA"
            docker image inspect "$BACKEND_IMAGE" --format '{{.Id}}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Allow the tracked local profile only in the CI test runner
        run: |
          set -euo pipefail
          cp Dockerfile Dockerfile.auth-ci
          cp .dockerignore Dockerfile.auth-ci.dockerignore
          printf '\n!src/main/resources/application-local.yml\n' >> Dockerfile.auth-ci.dockerignore

      - name: Build isolated authentication test runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.auth-ci
          target: auth-tests
          platforms: linux/amd64
          load: true
          push: false
          tags: hobbytree/auth-tests:ci

      - name: Prepare ephemeral fixtures and check configuration
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/hobbytree-ci-fixtures"
          sudo python3 scripts/ci/prepare-fixtures.py --output-dir "$fixture"
          echo "CI_FIXTURE_DIR=$fixture" >> "$GITHUB_ENV"
          echo "RDS_CA_BUNDLE=$fixture/ca.pem" >> "$GITHUB_ENV"
          export CI_FIXTURE_DIR="$fixture" RDS_CA_BUNDLE="$fixture/ca.pem"
          printf "DB_URL='%s'\nRDS_CA_BUNDLE='%s'\n" "$DB_URL" "$RDS_CA_BUNDLE" > "$RUNNER_TEMP/ci-settings"
          printf "AUTH_TRUSTED_PROXY_CIDRS=192.0.2.10/32\nKAKAO_APP_ID=1\nGOOGLE_CLIENT_ID=ci.apps.googleusercontent.com\nAPP_SECRETS_DIR=%s\nREDIS_SECRETS_DIR=%s\n" "$APP_SECRETS_DIR" "$REDIS_SECRETS_DIR" >> "$RUNNER_TEMP/ci-settings"
          python3 scripts/validate-ec2-config.py --env-file "$RUNNER_TEMP/ci-settings"
          sudo python3 scripts/validate-ec2-config.py --env-file "$RUNNER_TEMP/ci-settings" --check-secrets
          test "$(sudo stat -c '%u:%g:%a' "$APP_SECRETS_DIR/DB_PASSWORD")" = '10001:10001:400'
          test "$(sudo stat -c '%u:%g:%a' "$APP_SECRETS_DIR/JWT_SECRET")" = '10001:10001:400'
          docker compose -p hobbytree-ci -f compose.ec2.yml -f compose.ci.yml config --quiet
          docker compose -p hobbytree-ci -f compose.ec2.yml -f compose.ci.yml pull postgres redis
          pg_image=$(python3 -c "import json; print(next(x for x in json.load(open('deploy/base-image-lock.json')) if x['Repository']=='library/postgres')['IndexDigest'])")
          test "$(docker run --rm --entrypoint id "postgres@$pg_image" -u postgres)" = 999
          redis_image=$(python3 -c "import json; print(next(x for x in json.load(open('deploy/base-image-lock.json')) if x['Repository']=='library/redis')['IndexDigest'])")
          test "$(docker run --rm --entrypoint id "redis@$redis_image" -u redis)" = 999
          test "$(docker run --rm --entrypoint id "redis@$redis_image" -g redis)" = 999
          test "$(docker image inspect "$BACKEND_IMAGE" --format '{{.Architecture}}')" = amd64
          test "$(docker image inspect "$BACKEND_IMAGE" --format '{{.Config.User}}')" = '10001:10001'

      - name: Start isolated TLS PostgreSQL, Redis and backend with an explicit Origin
        run: |
          cat > "$RUNNER_TEMP/cors-ci.yml" <<'YAML'
          services:
            backend:
              environment:
                CORS_ALLOWED_ORIGINS: http://localhost:5173
          YAML
          docker compose -p hobbytree-ci -f compose.ec2.yml -f compose.ci.yml -f "$RUNNER_TEMP/cors-ci.yml" \
            up -d --no-build --wait --wait-timeout 180

      - name: Check actual HTTP preflight and authentication
        run: |
          set -euo pipefail
          url=http://127.0.0.1:8080/api/v1/users/me
          headers="$RUNNER_TEMP/cors-headers"
          body="$RUNNER_TEMP/cors-body"
          preflight() {
            curl --silent --show-error --max-time 10 --dump-header "$headers" --output /dev/null \
              --write-out '%{http_code}' -X OPTIONS -H "Origin: $1" \
              -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: authorization' "$url"
          }
          test "$(preflight http://localhost:5173)" = 200
          tr -d '\r' < "$headers" | grep -Fxi 'Access-Control-Allow-Origin: http://localhost:5173'
          tr -d '\r' < "$headers" | grep -Eqi '^Access-Control-Allow-Headers:.*authorization'
          test "$(preflight https://unlisted.example)" = 403
          if grep -qi '^Access-Control-Allow-Origin:' "$headers"; then
            echo 'Unexpected allow-origin for rejected preflight'
            exit 1
          fi
          test "$(curl --silent --show-error --max-time 10 --output "$body" --write-out '%{http_code}' \
            -H 'Origin: http://localhost:5173' "$url")" = 401
          jq -e '.code == "AUTH401_2"' "$body" >/dev/null
          echo 'PASS: allowed preflight 200, denied preflight 403, unauthenticated GET 401 AUTH401_2'

      - name: Health, Flyway off and failure cases
        run: python3 scripts/ci/verify-runtime.py

      - name: Authentication integration and Redis failure/recovery
        run: python3 scripts/ci/verify-auth-deployment.py

      - name: Stage the validated image archive
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verified-v5-cors"
          mkdir -p "$out"
          docker save "$BACKEND_IMAGE" | gzip -n > "$out/backend-linux-amd64.tar.gz"
          image_id=$(docker image inspect "$BACKEND_IMAGE" --format '{{.Id}}')
          jq -n --arg revision "$HOTFIX_SHA" --arg image "$BACKEND_IMAGE" --arg image_id "$image_id" \
            --arg run_id "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{revision:$revision, image:$image, image_id:$image_id, platform:"linux/amd64",
              run_id:$run_id, attempt:$attempt,
              schema_fingerprint:"84bbd4049e3e926c5b725d3c3213b2d6980202973aaba31299f1a4999dee0026"}' > "$out/receipt.json"
          (cd "$out" && sha256sum backend-linux-amd64.tar.gz receipt.json > SHA256SUMS)

      - name: Upload the candidate image without a registry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-v5-cors-linux-amd64
          path: ${{ runner.temp }}/verified-v5-cors/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Backend failure diagnostics (redacted)
        if: ${{ failure() && env.CI_FIXTURE_DIR != '' }}
        continue-on-error: true
        run: sudo --preserve-env=HOBBYTREE_CI,CI_FIXTURE_DIR,RDS_CA_BUNDLE,APP_SECRETS_DIR,AUTH_TRUSTED_PROXY_CIDRS,KAKAO_APP_ID,GOOGLE_CLIENT_ID,BACKEND_IMAGE,DB_URL python3 scripts/ci/diagnose-runtime.py

      - name: Cleanup only CI containers and volumes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CI_FIXTURE_DIR:-}" && -n "${RDS_CA_BUNDLE:-}" ]]; then
            docker compose -p hobbytree-ci -f compose.ec2.yml -f compose.ci.yml down --volumes --remove-orphans
          fi
          docker ps -aq --filter label=hobbytree.validation=1 --filter label=hobbytree.validation.project=hobbytree-ci | xargs -r docker rm -f >/dev/null
          sudo rm -f /run/hobbytree/ci/secrets/DB_USERNAME /run/hobbytree/ci/secrets/DB_PASSWORD /run/hobbytree/ci/secrets/JWT_SECRET /run/hobbytree/ci/secrets/REDIS_PASSWORD
          sudo rm -f /run/hobbytree/ci/redis-secrets/REDIS_PASSWORD /run/hobbytree/ci/redis-secrets/users.acl
          sudo rmdir /run/hobbytree/ci/redis-secrets 2>/dev/null || true
          sudo rmdir /run/hobbytree/ci/secrets 2>/dev/null || true

  migration-validation:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Kau-BugFree/hobby-tree-Backend' && github.ref == 'refs/heads/ci/v5-cors-preflight'
    name: Flyway V1-V5 upgrade PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIGRATION_INTEGRATION_TEST: 'true'
      MIGRATION_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/hobbytree_migration_ci
      MIGRATION_TEST_USERNAME: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HOTFIX_SHA }}
          persist-credentials: false

      - name: Verify the fixed candidate checkout
        run: test "$(git rev-parse HEAD)" = "$HOTFIX_SHA"

      - name: Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Start only the disposable migration PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "MIGRATION_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
          umask 077
          printf 'POSTGRES_PASSWORD=%s\nPOSTGRES_DB=hobbytree_migration_ci\n' "$password" > "$RUNNER_TEMP/hobbytree-migration.env"
          image=$(python3 -c "import json; print(next(x for x in json.load(open('deploy/base-image-lock.json')) if x['Repository']=='library/postgres')['IndexDigest'])")
          docker run --detach --name hobbytree-migration-ci \
            --env-file "$RUNNER_TEMP/hobbytree-migration.env" \
            --publish 127.0.0.1:15432:5432 \
            --tmpfs /var/lib/postgresql/data:rw,size=256m --memory 512m --cpus 1 \
            "postgres@$image" >/dev/null
          for _ in $(seq 1 60); do
            if docker exec hobbytree-migration-ci pg_isready -h 127.0.0.1 -U postgres -d hobbytree_migration_ci --quiet; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Approved transition regressions on disposable PostgreSQL
        env:
          V45_TEST_DSN: postgresql://127.0.0.1:15432/hobbytree_migration_ci
          PGUSER: postgres
          PGPASSWORD: ${{ env.MIGRATION_TEST_PASSWORD }}
        run: |
          python3 -m venv "$RUNNER_TEMP/v45-tests"
          "$RUNNER_TEMP/v45-tests/bin/pip" install -r deploy/v45-requirements.txt
          "$RUNNER_TEMP/v45-tests/bin/python" -m unittest discover -s scripts/tests -p 'test_v45*.py' -v

      - name: Fresh schema, V3 upgrade, constraints, locks and checksums
        shell: bash
        run: |
          set -euo pipefail
          sh ./gradlew --no-daemon --max-workers=2 test --tests '*FlywayMigrationTests' --rerun-tasks
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('build/test-results/test').glob('TEST-*FlywayMigrationTests.xml'))
          assert len(reports) == 1, 'Migration result missing'
          result = ET.parse(reports[0]).getroot()
          counts = {key: int(result.get(key, '0')) for key in ('tests', 'skipped', 'failures', 'errors')}
          assert counts['tests'] == 9 and not any(counts[key] for key in ('skipped', 'failures', 'errors')), counts
          print('MIGRATION_INTEGRATION_RESULT', counts)
          PY

      - name: Cleanup only this job's PostgreSQL
        if: always()
        shell: bash
        run: |
          docker rm --force hobbytree-migration-ci >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/hobbytree-migration.env"
