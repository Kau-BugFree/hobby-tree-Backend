name: HobbyTree EC2 Image Deployment

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Validated hobbytree/backend image digest (sha256:...)'
        type: string
        required: true
      expected_current_digest:
        description: 'Currently running digest; deployment fails on drift'
        type: string
        required: true
      image_revision:
        description: 'Full Git SHA of the validated ECR image'
        type: string
        required: true
      acknowledge_downtime:
        description: 'I approve single-EC2 downtime and possible ALB fail-open traffic'
        type: boolean
        default: false
        required: true
      confirm_no_migrations:
        description: 'No pending schema work; migration-set differences must be handled separately'
        type: boolean
        default: false
        required: true
      confirm_rollback_compatible:
        description: 'I reviewed previous/new application data compatibility for rollback'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: hobbytree-ec2-image-deployment
  cancel-in-progress: false

env:
  IMAGE_DIGEST: ${{ inputs.image_digest }}
  EXPECTED_CURRENT_DIGEST: ${{ inputs.expected_current_digest }}
  IMAGE_REVISION: ${{ inputs.image_revision }}
  ACK_DOWNTIME: ${{ inputs.acknowledge_downtime }}
  ACK_SCHEMA: ${{ inputs.confirm_no_migrations }}
  ACK_ROLLBACK: ${{ inputs.confirm_rollback_compatible }}

jobs:
  guard:
    name: Validate manual deployment intent without AWS
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate context, digests and acknowledgements
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('release', 'scripts/ci/ec2-deploy.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          release.inputs()
          print('Manual deployment intent validated; no AWS requests made.')
          PY

  deploy:
    name: Preflight and deploy a pinned ECR image
    needs: guard
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Kau-BugFree/hobby-tree-Backend' &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Obtain temporary credentials using develop OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ap-northeast-2
          role-to-assume: arn:aws:iam::494915081306:role/hobbytree-github-ec2-deploy-role
          audience: sts.amazonaws.com
          allowed-account-ids: '494915081306'
          role-session-name: hobbytree-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          use-existing-credentials: false
          force-skip-oidc: false
          output-credentials: false
          action-timeout-s: 90
      - name: Existing SSM Preflight must succeed before deployment
        run: python3 scripts/ci/ec2-preflight.py
      - name: Run the fixed deployment document and observe its terminal result
        run: python3 scripts/ci/ec2-deploy.py
