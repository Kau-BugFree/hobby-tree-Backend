# Install as /etc/systemd/system/hobbytree-ai.service.d/haiku.conf after approval.
# Retain the base unit's networking controls, timeouts and working directory.
[Service]
ExecStart=
ExecStart=/usr/bin/docker compose --env-file /opt/hobbytree-ai/release/runtime.env -f compose.yml -f compose.haiku.yml up -d --wait --wait-timeout 600
ExecStopPost=
ExecStopPost=/usr/bin/docker compose --env-file /opt/hobbytree-ai/release/runtime.env -f compose.yml -f compose.haiku.yml stop
